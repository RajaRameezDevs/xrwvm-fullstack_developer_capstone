name: Lint Python and JavaScript

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint Python with flake8
      run: |
        flake8 server/djangoapp server/djangoproj --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server/djangoapp server/djangoproj --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install jshint
      run: npm install -g jshint

    - name: Lint JavaScript with jshint
      run: jshint server/database/app.js
